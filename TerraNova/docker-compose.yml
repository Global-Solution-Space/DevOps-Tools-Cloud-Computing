#  TerraNova — Docker Compose
#  Banco  : PostgreSQL 16 + PostGIS 3.5  (postgis/postgis:16-3.5)
#  App    : TerraNova API (.NET 10  |  Npgsql EF Core v10 compat)
#  Rede   : terranova_net (bridge compartilhada)

services:
  postgres-db:
    image: postgis/postgis:16-3.5
    container_name: postgres-db-rm561432
    restart: unless-stopped
    environment:
      POSTGRES_DB: terranova
      POSTGRES_USER: terranova_user
      POSTGRES_PASSWORD: terranova123
    volumes:
      - terranova_postgres_data:/var/lib/postgresql/data
      - ./sql/00_postgis_extension.sql:/docker-entrypoint-initdb.d/00_postgis_extension.sql:ro
    ports:
      - "5432:5432"
    networks:
      - terranova_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terranova_user -d terranova"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  terranova-api:
    build:
      context: .
      dockerfile: TerraNova.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: enzookuizumi/terranova-api:v1
    container_name: terranova-api-rm561432
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__TerraNovaPostgres: "Host=postgres-db;Port=5432;Database=terranova;Username=terranova_user;Password=terranova123;"
      SatVegApiToken: "Bearer e97dab05-eedc-39b9-a3fd-fa83cb5fef5e"
    networks:
      - terranova_net
    restart: on-failure

networks:
  terranova_net:
    driver: bridge

volumes:
  terranova_postgres_data: