#  TerraNova — Docker Compose
#  Banco  : Oracle XE 21c  (gvenzl/oracle-xe:21-slim)
#  App    : TerraNova API (.NET 10  |  Oracle EF Core v10 compat)
#  Rede   : terranova_net (bridge compartilhada)

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db-rm561432
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: oracle_terranova
      APP_USER: terranova_user
      APP_USER_PASSWORD: terranova123
    volumes:
      - terranova_oracle_data:/opt/oracle/oradata
    ports:
      - "1521:1521"
    networks:
      - terranova_net
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  terranova-api:
    build:
      context: .
      dockerfile: TerraNova.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: SEU-DOCKERHUB/terranova-api:v1
    container_name: terranova-api-rm561432
    depends_on:
      oracle-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__TerraNovaOracle: "User Id=terranova_user;Password=terranova123;Data Source=oracle-db:1521/XEPDB1;"
      SatVegApiToken: "Bearer e97dab05-eedc-39b9-a3fd-fa83cb5fef5e"
    networks:
      - terranova_net
    restart: on-failure

networks:
  terranova_net:
    driver: bridge

volumes:
  terranova_oracle_data: